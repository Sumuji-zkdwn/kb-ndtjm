name: ARC3 autonomous public refinement

on:
  push:
    branches: ['codex/arc3-autonomous-*']
    paths:
      - 'experiments/arc3/autonomous/**'
      - 'experiments/arc3/human_loop/**'
      - '.github/workflows/arc3-autonomous-public.yml'
  pull_request:
    paths:
      - 'experiments/arc3/autonomous/**'
      - 'experiments/arc3/human_loop/**'
      - '.github/workflows/arc3-autonomous-public.yml'
  workflow_dispatch:
    inputs:
      run_public:
        description: Run the finite local public-demo search (never submit to Kaggle)
        type: boolean
        default: false
      source_run_id:
        description: Optional prior run with autonomous-public-evidence to resume unchanged
        type: string
        default: ''

permissions:
  contents: read
  actions: read

concurrency:
  group: arc3-autonomous-public-${{ github.ref }}
  cancel-in-progress: false

jobs:
  controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: experiments/arc3/autonomous/requirements.txt
      - run: python -m pip install -r experiments/arc3/autonomous/requirements.txt
      - run: python -m pip install -r experiments/arc3/human_loop/requirements.txt
      - name: Check human-data prediction, censoring, exploration, and frozen holdout
        run: python -B -m unittest discover -s experiments/arc3/human_loop -p test_human.py -v
      - name: Replay existing state and observation examples and verify research artifacts
        run: python -B experiments/arc3/human_loop/research/verify_existing.py
      - name: Test generation, adoption, rejection, budgets, integrity, and resume
        run: python -B -m unittest discover -s experiments/arc3/autonomous -p test_autonomous.py -v
      - name: Check compatibility with the existing cycle
        run: python -B -m unittest discover -s experiments/arc3/cycle -p test_cycle.py -v

  public-search:
    if: github.event_name == 'workflow_dispatch' && inputs.run_public
    needs: controls
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r experiments/arc3/autonomous/requirements.txt kaggle==2.2.5
      - name: Validate resume identifier
        env:
          SOURCE_RUN: ${{ inputs.source_run_id }}
        run: |
          python - <<'PY'
          import os
          value = os.environ['SOURCE_RUN']
          if value and not (value.isascii() and value.isdigit()):
              raise ValueError('source_run_id must be a numeric Actions run ID')
          PY
      - name: Restore public experiment evidence
        if: inputs.source_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.source_run_id }}
        run: gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --name autonomous-public-evidence --dir build/autonomous-public
      - name: Download public SDK and demo assets only
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          if not os.environ.get('KAGGLE_API_TOKEN'):
              raise RuntimeError('The existing competition-download credential is required')
          from kaggle.api.kaggle_api_extended import KaggleApi
          destination = Path('build/official-input')
          destination.mkdir(parents=True, exist_ok=True)
          api = KaggleApi()
          api.authenticate()
          api.competition_download_files('arc-prize-2026-arc-agi-3', str(destination), quiet=True)
          PY
      - name: Generate, evaluate, compare, and select on public demos
        # No credential is passed to the search step. Workers also reject network calls.
        run: |
          python -B -u experiments/arc3/autonomous/loop.py \
            --official-zip build/official-input/arc-prize-2026-arc-agi-3.zip \
            --out build/autonomous-public
      - name: Preserve decisions, candidates, and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autonomous-public-evidence
          path: |
            build/autonomous-public/**
            !build/autonomous-public/runtime/**
            !build/autonomous-public/**/temporary/**
            !build/autonomous-public/run.lock
          if-no-files-found: warn
          retention-days: 90
