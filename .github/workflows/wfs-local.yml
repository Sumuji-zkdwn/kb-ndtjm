name: Quantum WFS phase kernel (phone/cloud)

on:
  workflow_dispatch:
  push:
    paths:
      - 'quantum/**'
      - 'loopcore/**'
      - 'tests/test_loopcore.py'
      - 'tools/verify_wfs_loop_local.py'
      - '.github/workflows/wfs-local.yml'

permissions:
  contents: read

jobs:
  local-proof:
    name: Build and prove local kernel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Run extracted WFS verification loop
        run: |
          python -m unittest discover -s tests -p test_loopcore.py -v
          python -m loopcore run --domain wfs --root build/operator-loop-wfs
          python -m loopcore run --domain wfs --root build/operator-loop-wfs
          python -m loopcore run --domain wfs --root build/operator-loop-wfs
          python -m loopcore audit --domain wfs --root build/operator-loop-wfs --recheck

      - name: Independently compare private original compiler and verified reentry
        run: |
          python tools/verify_wfs_loop_local.py --output build/wfs-loop-offline-report.json

      - name: Generate KMx and verify exact phase + restoration
        run: python quantum/wfs_mobile_ci.py --output build/wfs
      - name: Compare baseline archive against original manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/baseline
          gh release download v1.0 --repo "$GITHUB_REPOSITORY" --pattern 'submission.zip' --dir build/baseline
          python - <<'PY'
          from pathlib import Path
          import hashlib, zipfile
          p = Path("build/baseline/submission.zip")
          digest = hashlib.sha256(p.read_bytes()).hexdigest()
          assert digest == "04cf2fc7518e9cc2f9207f61b9421448a0b02368756c6b342fb4cea8c47b0f43"
          with zipfile.ZipFile(p) as z:
              names = z.namelist()
              assert len(names) == 13
              assert {"dqi.kmb", "invsqrt.kmb", "dfthcsos/submission.npz"} <= set(names)
          print("Original DQI baseline archive verified. This step does NOT alter it.")
          PY
      - name: Save local kernels and report
        uses: actions/upload-artifact@v6
        with:
          name: wfs-local-kmx-and-report
          path: build/wfs/
          if-no-files-found: error
          retention-days: 14

      - name: Retain portable WFS cycle and SHA-256 evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: wfs-operator-loop-ledger
          path: build/operator-loop-wfs/
          if-no-files-found: warn
          retention-days: 14

      - name: Retain original-source parity report (local scope only)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: wfs-original-loop-source-parity
          path: build/wfs-loop-offline-report.json
          if-no-files-found: warn
          retention-days: 30

  kickmix-parse:
    name: Parse KMx with Kickmix
    needs: local-proof
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v7
        with:
          name: wfs-local-kmx-and-report
          path: build/wfs
      - name: Install upstream Kickmix C++/Python library
        run: |
          git clone --filter=blob:none https://github.com/quantumlib/Qualtran.git qualtran-src
          cd qualtran-src
          git checkout 638777fac4379bc62e2a1e4a52cf1a1753895d48
          cd ..
          python -m pip install ./qualtran-src/kickmix
      - name: Parse all local KMx files
        run: |
          python quantum/wfs_mobile_ci.py --output build/wfs --parse
      - name: Save parsed report
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: wfs-kickmix-parser-report
          path: build/wfs/report.json
          retention-days: 14
