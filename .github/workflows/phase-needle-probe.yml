name: Inspect phase and needle research notebook

on:
  push:
    branches: [codex/kaggle-dispatch-20261031]
    paths: [research_phase_needle_probe/request.json]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install kaggle==2.2.5 kagglesdk==0.1.38
      - name: Read the private version without modification
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: python -u research_phase_needle_probe/readonly_probe.py
