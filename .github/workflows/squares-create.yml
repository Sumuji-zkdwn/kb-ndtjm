name: Create private Squares diagnostic once
on:
  push:
    branches: [codex/kaggle-dispatch-20261031]
    paths: [kaggle_squares_create/request.json]
permissions:
  contents: read
concurrency:
  group: bounded-kaggle-dispatch
  queue: max
jobs:
  create:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test creation protections
        run: python -m unittest discover -s kaggle_squares_create -p test_create_once.py -v
      - run: python -m pip install kaggle==2.2.5 kagglesdk==0.1.38
      - name: Create private offline notebook once
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: python -u kaggle_squares_create/create_once.py
