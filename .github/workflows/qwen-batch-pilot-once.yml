name: One-time synthetic Qwen batch pilot

on:
  push:
    branches: [codex/kaggle-dispatch-20261031]
    paths: [qwen_batch_pilot/once.json]

permissions:
  contents: read

concurrency:
  group: bounded-kaggle-dispatch
  queue: max

jobs:
  pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install kaggle==2.2.5 kagglesdk==0.1.38
      - name: Check safety rules without credentials
        run: python -m unittest discover -s qwen_batch_pilot -p test_pilot_once.py -v
      - name: Run the synthetic private pilot once
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: python -u qwen_batch_pilot/pilot_once.py
      - name: Save synthetic pilot results
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-qwen-batch-results
          path: qwen_batch_pilot/pilot-output/
          if-no-files-found: error
          retention-days: 7
