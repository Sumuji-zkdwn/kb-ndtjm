name: ARC3 CPU and GPU improvement cycle

on:
  push:
    branches: ['codex/arc3-cycle-*', main]
    paths:
      - 'experiments/arc3/cycle/**'
      - '.github/workflows/arc3-improvement-cycle.yml'
  pull_request:
    paths:
      - 'experiments/arc3/cycle/**'
      - '.github/workflows/arc3-improvement-cycle.yml'
  workflow_dispatch:
    inputs:
      stage:
        type: choice
        default: prepare
        options: [prepare, public-smoke, start, observe, collect, submit, adopt-kernel, reconcile-submission, gpu-pair, cpu-pair]
      profile:
        type: choice
        default: all
        options: [all, cpu-c8b, cpu-c8b-probe64, gpu-baseline, gpu-memory]
      label:
        type: string
        default: baseline-20261029
      hypothesis:
        type: string
        default: Reproduce the frozen baseline before proposing one change.
      source_run_id:
        description: Exact previous cycle run whose evidence artifact should be restored
        type: string
        default: ''
      connection_run_id:
        description: Successful official connection workflow run for the exact candidate code
        type: string
        default: ''
      version:
        description: Exact notebook version, for adopt-kernel only
        type: string
        default: ''
      baseline_label:
        description: Baseline label for the GPU memory comparison
        type: string
        default: baseline-20261029
      candidate_label:
        description: Existing probe64 candidate label for cpu-pair only
        type: string
        default: probe64-v1

permissions:
  contents: read
  actions: read

concurrency:
  group: arc3-kaggle-cycle-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: experiments/arc3/cycle/requirements.txt
      - run: python -m pip install -r experiments/arc3/cycle/requirements.txt
      - name: Test version identity, recovery and score boundaries offline
        run: python -X utf8 -m unittest discover -s experiments/arc3/cycle -p 'test_cycle.py' -v
      - name: Validate all frozen notebook profiles without credentials
        run: python -X utf8 experiments/arc3/cycle/runner.py --offline-all --root build/offline

  cycle:
    needs: contracts
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 190
    env:
      CYCLE_STAGE: ${{ inputs.stage }}
      CYCLE_PROFILE: ${{ inputs.profile }}
      CYCLE_LABEL: ${{ inputs.label }}
      CYCLE_HYPOTHESIS: ${{ inputs.hypothesis }}
      CYCLE_SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      CYCLE_CONNECTION_RUN_ID: ${{ inputs.connection_run_id }}
      CYCLE_VERSION: ${{ inputs.version }}
      CYCLE_BASELINE_LABEL: ${{ inputs.baseline_label }}
      CYCLE_CANDIDATE_LABEL: ${{ inputs.candidate_label }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r experiments/arc3/cycle/requirements.txt
      - name: Read and validate the concrete cycle request
        id: request
        run: python experiments/arc3/cycle/runner.py --config-only
      - name: Restore exact earlier notebook versions and submission receipts
        if: steps.request.outputs.source_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ steps.request.outputs.source_run_id }}
        run: gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --name arc3-cycle-evidence --dir build/arc3-cycle
      - name: Restore the matching official connection report
        if: steps.request.outputs.connection_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          CONNECTION_RUN: ${{ steps.request.outputs.connection_run_id }}
          CONNECTION_PROFILE: ${{ steps.request.outputs.connection_profile }}
        run: gh run download "$CONNECTION_RUN" --repo "$GITHUB_REPOSITORY" --name "arc3-official-connection-$CONNECTION_PROFILE" --dir build/connection-import
      - name: Require the existing Kaggle credential for live stages
        if: steps.request.outputs.stage != 'prepare' && steps.request.outputs.stage != 'public-smoke'
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          if [ -z "$KAGGLE_API_TOKEN" ]; then
            echo '::error::Add repository Actions secret KAGGLE_API_TOKEN. Never put the token in request.json or notebook cells.'
            exit 2
          fi
      - name: Download public environments for the exact CPU candidate smoke
        if: steps.request.outputs.stage == 'public-smoke'
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile
          from kaggle.api.kaggle_api_extended import KaggleApi
          destination=Path('build/official-competition')
          destination.mkdir(parents=True)
          api=KaggleApi()
          api.authenticate()
          api.competition_download_files('arc-prize-2026-arc-agi-3', str(destination), quiet=True)
          archive=destination/'arc-prize-2026-arc-agi-3.zip'
          with zipfile.ZipFile(archive) as bundle:
              bundle.extractall(destination)
          import os
          with open(os.environ['GITHUB_ENV'],'a') as stream:
              stream.write('ARC3_OFFICIAL_ZIP='+str(archive.resolve())+'\n')
              stream.write('ARC3_ENVIRONMENTS='+str((destination/'environment_files').resolve())+'\n')
          PY
          python -m pip install --no-index --find-links build/official-competition/arc_agi_3_wheels arc-agi==0.9.8 arcengine==0.9.3
      - name: Execute the requested stage or bounded GPU pair
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: python -u -X utf8 experiments/arc3/cycle/runner.py
      - name: Retain candidates and receipts, including failed or ambiguous attempts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arc3-cycle-evidence
          path: build/arc3-cycle/
          if-no-files-found: warn
          retention-days: 90
