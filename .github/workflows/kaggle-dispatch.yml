name: Read-only private Kaggle notebook diagnostics

on:
  push:
    branches: [codex/kaggle-dispatch-20261031]
    paths: [kaggle_dispatch/request.json]

permissions:
  contents: read
concurrency:
  group: bounded-kaggle-dispatch
  cancel-in-progress: false

jobs:
  diagnostics:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test read-only diagnostic
        run: python -m unittest discover -s kaggle_dispatch -p test_owned_probe.py -v
      - run: python -m pip install kaggle==2.2.5 kagglesdk==0.1.38
      - name: Read metadata and cell fingerprints without source or output
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: python -u kaggle_dispatch/owned_probe.py
