name: Bounded private Kaggle notebook dispatch

on:
  push:
    branches: [codex/kaggle-dispatch-20261031]
    paths:
      - kaggle_dispatch/request.json

permissions:
  contents: read
concurrency:
  group: bounded-kaggle-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test fail-closed dispatch logic without credentials
        run: python -m unittest discover -s kaggle_dispatch -p test_runner.py -v
      - run: python -m pip install kaggle==2.2.5 kagglesdk==0.1.38
      - name: Validate local request and dispatch exactly one registered private notebook
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_DIAGNOSTIC_ONLY: '0'
        run: python -u kaggle_dispatch/runner.py
