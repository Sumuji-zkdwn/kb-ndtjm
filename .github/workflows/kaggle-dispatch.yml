name: Run registered private Kaggle notebook

on:
  push:
    branches: [codex/kaggle-dispatch-20261031]
    paths: [kaggle_dispatch/request.json]

permissions:
  contents: read

concurrency:
  group: bounded-kaggle-dispatch
  queue: max

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check dispatch protections without credentials
        run: python -m unittest discover -s kaggle_dispatch -p test_router.py -v
      - run: python -m pip install kaggle==2.2.5 kagglesdk==0.1.38
      - name: Run one selected registered notebook
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: python -u kaggle_dispatch/router.py
