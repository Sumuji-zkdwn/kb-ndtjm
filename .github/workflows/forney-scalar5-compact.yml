name: Scalar5 Forney workspace experimental audit (no submissions)

on:
  pull_request:
    branches:
      - wfs/dqi-bm-blindcoop-20261027
    paths:
      - 'experiments/audit_forney_allocation_trace.py'
      - 'experiments/test_forney_scalar5_compaction.py'
      - 'research/bm_port/build_dqi.py'
      - 'research/bm_port/trace_phase.py'
      - '.github/workflows/forney-scalar5-compact.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-only-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Verify modified Python syntax
        run: |
          python -m compileall -q research/bm_port/build_dqi.py research/bm_port/trace_phase.py experiments/audit_forney_allocation_trace.py experiments/test_forney_scalar5_compaction.py
      - name: Replay pinned 6257-event allocation log
        run: python experiments/audit_forney_allocation_trace.py
      - name: Check unreferenced slots, ownership, and existing scalar5 phase certificate
        run: |
          python -m pip install --disable-pip-version-check numpy
          python -m unittest discover -s experiments -p 'test_forney_scalar5_compaction.py' -v
      - name: Explicit full-verifier boundary
        run: |
          echo 'This is a local-only optimization hypothesis.'
          echo 'Full DQI build, Kickmix full parse, published 102400-shot verifier, and Kaggle evaluation: NOT RUN.'
