name: Read-only Qwen batch anchor fingerprint

on:
  push:
    branches: [codex/kaggle-dispatch-20261031]
    paths: [qwen_batch_pilot/anchor_diagnostic_request.json]

permissions:
  contents: read

concurrency:
  group: bounded-kaggle-dispatch
  queue: max

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install kaggle==2.2.5 kagglesdk==0.1.38
      - name: Read the saved initial version only
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: python -u qwen_batch_pilot/anchor_diagnostic.py
