name: ARC3 official bundle connection checks

on:
  push:
    branches: ['codex/arc3-cycle-audit-*']
    paths:
      - '.github/workflows/arc3-official-connection.yml'
      - 'experiments/arc3/cycle/connection_check.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  connection:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r experiments/arc3/cycle/requirements.txt
      - name: Obtain official runtime and the exact configured GPU source input
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          python - <<'PY'
          from pathlib import Path
          from kaggle.api.kaggle_api_extended import KaggleApi
          p=Path('build/connection-inputs')
          p.mkdir(parents=True)
          api=KaggleApi()
          api.authenticate()
          api.competition_download_files('arc-prize-2026-arc-agi-3', str(p), quiet=True)
          api.dataset_download_files('dfranzen/taaf-kaggle-source-bundle-copy', str(p), quiet=True)
          print('Downloaded official competition bundle and configured source bundle; no model weights or notebook session requested.')
          PY
      - name: Run connection checks when the audit implementation is present
        run: |
          if [ -f experiments/arc3/cycle/connection_check.py ]; then
            python experiments/arc3/cycle/connection_check.py --competition-zip build/connection-inputs/arc-prize-2026-arc-agi-3.zip --source-zip build/connection-inputs/taaf-kaggle-source-bundle-copy.zip --out build/connection-report
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arc3-official-connection
          path: |
            build/connection-inputs/
            build/connection-report/
          retention-days: 30
