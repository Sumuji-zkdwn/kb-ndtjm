name: Run Squares diagnostic on dedicated private anchor
on:
  push:
    branches: [codex/kaggle-dispatch-20261031]
    paths: [kaggle_squares_anchor/request.json]
permissions:
  contents: read
concurrency:
  group: bounded-kaggle-dispatch
  queue: max
jobs:
  send:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test safety guards
        run: python -m unittest discover -s kaggle_squares_anchor -p test_anchor_send.py -v
      - run: python -m pip install kaggle==2.2.5 kagglesdk==0.1.38
      - name: Run one private offline diagnostic
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: python -u kaggle_squares_anchor/anchor_send.py
