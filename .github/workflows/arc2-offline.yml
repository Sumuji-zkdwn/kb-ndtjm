name: ARC2 offline candidate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'experiments/arc2/**'
      - '.github/workflows/arc2-offline.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: experiments/arc2
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install tested numerical dependency
        run: python -m pip install numpy==2.3.5
      - name: Compile the bundled generic C++ backend
        run: |
          python - <<'PY'
          from arc2.cpp_backend import prepare_cpp_backend
          result = prepare_cpp_backend(compile_seconds=180)
          print(result)
          assert result['status'] == 'ready', result
          PY
      - name: Check inference, isolation, and exact output scoring
        run: python -m unittest discover -s tests -v
      - name: Reproduce the embedded notebook
        run: |
          python tools/build_notebook.py --output /tmp/arc2_kaggle.ipynb
          cmp arc2_kaggle.ipynb /tmp/arc2_kaggle.ipynb
